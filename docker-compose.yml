# Runs the whole system with one command:   docker compose up --build
#
#   postgres      :5432   database (data kept in the "pgdata" volume)
#   helpdesk-api  :8080   Spring Boot, "docker" profile -> PostgreSQL + Flyway
#   ai-service    :8000   FastAPI; reads OPENAI_API_KEY from ai-service/.env
#
# Optional overrides go in a .env file next to this one (see .env.example).

name: helpdesk

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: ${DB_USER:-helpdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helpdesk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  helpdesk-api:
    build: ./helpdesk-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/helpdesk
      DB_USER: ${DB_USER:-helpdesk}
      DB_PASSWORD: ${DB_PASSWORD:-helpdesk}
      # Containers reach each other by service name, not localhost
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_API_KEY: ${SERVICE_API_KEY:-local-dev-secret}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  ai-service:
    build: ./ai-service
    env_file:
      # Your existing file with OPENAI_API_KEY. Optional: without it the offline rules are used.
      - path: ./ai-service/.env
        required: false
    environment:
      # These win over values in ai-service/.env
      HELPDESK_API_URL: http://helpdesk-api:8080
      SERVICE_API_KEY: ${SERVICE_API_KEY:-local-dev-secret}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
