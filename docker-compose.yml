# Runs the whole system with one command:   docker compose up --build
#
#   postgres      :5432   database (data kept in the "pgdata" volume)
#   rabbitmq      :5672   message broker; management UI on http://localhost:15672
#   helpdesk-api  :8080   Spring Boot, "docker" profile -> PostgreSQL + Flyway
#   ai-service    :8000   FastAPI; reads OPENAI_API_KEY from ai-service/.env
#
# Optional overrides go in a .env file next to this one (see .env.example).

name: helpdesk

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: ${DB_USER:-helpdesk}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helpdesk}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d helpdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    # RabbitMQ stores data per node name (derived from the hostname); a fixed hostname keeps
    # queued messages across container re-creation
    hostname: rabbitmq
    environment:
      # the built-in "guest" user only works from localhost, so containers need their own user
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-helpdesk}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-helpdesk}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI: queues, message counts, dead-letter queues
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  helpdesk-api:
    build: ./helpdesk-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/helpdesk
      DB_USER: ${DB_USER:-helpdesk}
      DB_PASSWORD: ${DB_PASSWORD:-helpdesk}
      # Containers reach each other by service name, not localhost
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_API_KEY: ${SERVICE_API_KEY:-local-dev-secret}
      # Stage 5c: key ai-service must present to call /internal/agent/** (the agent's tools)
      INTERNAL_API_KEY: ${SERVICE_API_KEY:-local-dev-secret}
      # Stage 5b: auto-triage over RabbitMQ (enabled by the docker profile)
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-helpdesk}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-helpdesk}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  ai-service:
    build: ./ai-service
    depends_on:
      rabbitmq:
        condition: service_healthy
    env_file:
      # Your existing file with OPENAI_API_KEY. Optional: without it the offline rules are used.
      - path: ./ai-service/.env
        required: false
    environment:
      # These win over values in ai-service/.env
      HELPDESK_API_URL: http://helpdesk-api:8080
      SERVICE_API_KEY: ${SERVICE_API_KEY:-local-dev-secret}
      # Stage 5c: sent as X-Api-Key when the agent's tools call helpdesk-api's internal API
      HELPDESK_API_KEY: ${SERVICE_API_KEY:-local-dev-secret}
      # Stage 5b: consume ticket.created, publish ticket.triaged
      AUTO_TRIAGE_WORKER_ENABLED: "true"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-helpdesk}:${RABBITMQ_PASSWORD:-helpdesk}@rabbitmq:5672/
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
  rabbitmqdata:
