# Serves the built UI and forwards /api to helpdesk-api inside the Docker network.
# The browser only ever talks to this one origin, so helpdesk-api needs no CORS setup.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://helpdesk-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI drafting can take a while (several model calls plus tool calls)
        proxy_read_timeout 120s;
    }

    # Vite puts a content hash in asset file names, so they can be cached for a long time
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must never be cached, or users keep loading an old build
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
