# Active when SPRING_PROFILES_ACTIVE=docker (set by docker-compose.yml).
# Overrides the H2 defaults in application.yml with PostgreSQL + Flyway migrations.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${DB_USER:helpdesk}
    password: ${DB_PASSWORD:helpdesk}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities match it
      ddl-auto: validate
  flyway:
    enabled: true
  h2:
    console:
      enabled: false
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}

helpdesk:
  auto-triage:
    enabled: true

management:
  health:
    rabbit:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
