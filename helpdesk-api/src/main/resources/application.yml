spring:
  application:
    name: helpdesk-api
  datasource:
    url: jdbc:h2:mem:helpdesk;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  # H2 uses Hibernate's create-drop above; Flyway migrations run only in the docker profile
  flyway:
    enabled: false
  # Stage 5b: RabbitMQ. Only used when helpdesk.auto-triage.enabled=true (docker profile).
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:helpdesk}
    password: ${RABBITMQ_PASSWORD:helpdesk}
    connection-timeout: 5s
    listener:
      simple:
        prefetch: 10
        # failed messages are not put back on the queue forever...
        default-requeue-rejected: false
        retry:
          # ...they are retried 3 times with backoff, then dead-lettered to the .dlq queue
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    # no broker when running locally; the docker profile turns this check back on
    rabbit:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

helpdesk:
  # Loads demo customers, orders, agents and tickets on startup
  seed-demo-data: true
  # Stage 5b: publish ticket.created to RabbitMQ and apply results from ai-service.
  # Off by default (no broker needed for local runs and tests); on in the docker profile.
  auto-triage:
    enabled: false
  internal-api:
    key: ${INTERNAL_API_KEY:local-dev-secret}

# Stage 2: the Python ai-service (see ai-service/README.md)
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
  # Must match SERVICE_API_KEY in ai-service/.env (leave both empty to disable)
  api-key: ${AI_SERVICE_API_KEY:}
  connect-timeout: 2s
  read-timeout: 30s
  # Suggestions below this confidence are recorded as a comment but not applied
  min-confidence: 0.6
  # Stage 3: the reply-drafting agent makes several LLM + tool calls, so allow longer
  agent:
    read-timeout: 90s
